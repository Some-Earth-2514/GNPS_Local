<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GNPS Local{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #2f81f7;
      --accent-hover: #388bfd;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --running: #58a6ff;
      --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --log-text: #adbac7;

      --badge-queued-bg: #21262d;
      --badge-queued-text: #7d8590;
      
      --badge-running-bg: #0d2340;
      --badge-running-text: #58a6ff;
      --badge-running-border: #1f4070;

      --badge-done-bg: #0d2a0d;
      --badge-done-text: #3fb950;
      --badge-done-border: #1a4a1a;

      --badge-failed-bg: #2d0d0d;
      --badge-failed-text: #f85149;
      --badge-failed-border: #4a1a1a;

      --badge-canceled-bg: var(--badge-failed-bg);
      --badge-canceled-text: var(--badge-failed-text);
      --badge-canceled-border: var(--badge-failed-border);

      --t-metadata:   #1d6db3;
      --t-spectra:    #7c3aed;
      --t-networking: #c2570d;
      --t-library:    #dc2626;
      --t-cluster:    #0e7490;
      --t-graphml:    #15803d;
      --t-other:      #636c76;
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --surface2: #eaeef2;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #636c76;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --success: #1a7f37;
      --warning: #9a6700;
      --danger: #d1242f;
      --running: #0969da;
      --log-text: #24292f;

      --badge-queued-bg: #eff2f5;
      --badge-queued-text: #636c76;

      --badge-running-bg: #ddf4ff;
      --badge-running-text: #0969da;
      --badge-running-border: #54aeff4d;

      --badge-done-bg: #dafbe1;
      --badge-done-text: #1a7f37;
      --badge-done-border: #1a7f3726;

      --badge-failed-bg: #ffebe9;
      --badge-failed-text: #d1242f;
      --badge-failed-border: #d1242f33;

      --badge-canceled-bg: var(--badge-failed-bg);
      --badge-canceled-text: var(--badge-failed-text);
      --badge-canceled-border: var(--badge-failed-border);

      --t-metadata:   #4f9eff;
      --t-spectra:    #c084fc;
      --t-networking: #fb923c;
      --t-library:    #f87171;
      --t-cluster:    #38bdf8;
      --t-graphml:    #4ade80;
      --t-other:      #7d8590;
    }

    *, *::before, *::after { transition: background-color 0.2s, border-color 0.2s, color 0.2s; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .nav-brand span { color: var(--accent); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    nav a:hover { color: var(--text); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
    p.subtitle { color: var(--muted); font-size: 12px; margin-bottom: 28px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge-queued  { 
      background: var(--badge-queued-bg); 
      color: var(--badge-queued-text); 
      border: 1px solid var(--border); 
    }

    .badge-running { 
      background: var(--badge-running-bg); 
      color: var(--badge-running-text); 
      border: 1px solid var(--badge-running-border); 
    }

    .badge-done { 
      background: var(--badge-done-bg); 
      color: var(--badge-done-text); 
      border: 1px solid var(--badge-done-border); 
    }

    .badge-failed { 
      background: var(--badge-failed-bg); 
      color: var(--badge-failed-text); 
      border: 1px solid var(--badge-failed-border); 
    }

    .badge-canceled { 
      background: var(--badge-canceled-bg); 
      color: var(--badge-canceled-text); 
      border: 1px solid var(--badge-canceled-border); 
    }

    .btn {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.4);
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    input[type=text], input[type=number], select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 12px;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .job-section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0 24px;
    }

    .form-grid-hidden {
      display: grid;
      grid-column: span 2;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0 24px;
    }

    .form-section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin: 24px 0 8px;
      grid-column: 1 / -1;
    }

    .file-drop {
      text-transform: none;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 8px;
    }

    .file-drop:hover, .file-drop.drag-over {
      border-color: var(--accent);
      color: var(--text);
    }

    .file-drop input[type=file] {
      display: none;
    }

    .file-list { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .file-placeholder {  color: var(--muted); }
    
    .file-list.has-files { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .mono { font-family: var(--font); }
    .muted { color: var(--muted); }

    pre.log {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      font-size: 11px;
      color: var(--log-text);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 500px;
      overflow-y: auto;
    }

    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">GNPS<span>Local</span></a>
  <a href="/">Home</a>
  <a href="/jobs">Jobs</a>
  <a href="/submit/molecular_networking">Mol. Networking</a>
  <a href="/submit/fbmn">FBMN</a>
  <a href="/submit/mshub_gc">GC-MS</a>
  <a href="/submit/mcn">MCN</a>
  <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
    <button id="theme-toggle" onclick="toggleTheme()" style="
      background:transparent; border:1px solid var(--border); border-radius:6px;
      color:var(--muted); font-family:var(--font); font-size:11px;
      padding:4px 10px; cursor:pointer; letter-spacing:0.5px;
      transition:border-color 0.15s, color 0.15s;
    ">LIGHT</button>
    <a href="/settings" id="gear-btn" title="Settings" style="
      display:inline-flex; align-items:center; justify-content:center;
      background:transparent; border:1px solid var(--border); border-radius:6px;
      color:var(--muted); font-size:20px; line-height:1;
      padding:2px 8px; cursor:pointer; text-decoration:none;
      transition:border-color 0.15s, color 0.15s;
    ">&#9881;</a>
  </div>
</nav>


<main>
{% block content %}{% endblock %}
</main>
<script>
// ── Global file-drop zone handler ────────────────────────────────────────────
// Handles all .file-drop zones: click-to-browse, drag-and-drop, file list update.
// Zones that manage their own listeners (e.g. settings page) call
// e.stopPropagation() on their zone's click to avoid double-open.
function _initDropZone(zone) {
  const input       = zone.querySelector('input[type=file]');
  const placeholder = zone.querySelector('.file-placeholder');
  const fileList    = zone.querySelector('.file-list');
  if (!input) return;

  // Click zone → open file picker (guard: ignore clicks that originated on the input itself)
  zone.addEventListener('click', e => {
    if (e.target === input) return;
    input.click();
  });

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e => {
    // Only remove class if leaving the zone entirely (not a child element)
    if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
  });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    // DataTransfer is read-only — reassign via a new FileList isn't possible in all
    // browsers; use a DataTransfer object to set files properly
    const dt = new DataTransfer();
    Array.from(e.dataTransfer.files).forEach(f => dt.items.add(f));
    input.files = dt.files;
    input.dispatchEvent(new Event('change'));
  });

  input.addEventListener('change', () => {
    const files = Array.from(input.files);
    if (placeholder) placeholder.style.display = files.length ? 'none' : 'block';
    if (fileList) {
      fileList.style.display = files.length ? 'block' : 'none';
      fileList.innerHTML = files.map(f => `<div>${f.name}</div>`).join('');
    }
  });
}

document.querySelectorAll('.file-drop').forEach(_initDropZone);
</script>
{% block scripts %}{% endblock %}
<script>
(function() {
  const saved = localStorage.getItem('gnps-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = saved === 'dark' ? 'LIGHT' : 'DARK';
  });
})();

function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('gnps-theme', next);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = next === 'dark' ? 'LIGHT' : 'DARK';
  if (typeof window._onThemeChange === 'function') window._onThemeChange(next);
}


</script>
</body>
</html>
