<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GNPS Local{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<nav>
  <a href="/" class="nav-brand">GNPS<span>Local</span></a>
  <a href="/">Home</a>
  <a href="/jobs">Jobs</a>
  <a href="/submit/molecular_networking">Mol. Networking</a>
  <a href="/submit/fbmn">FBMN</a>
  <a href="/submit/mshub_gc">GC-MS</a>
  <a href="/submit/mcn">MCN</a>
  <div class="nav-controls">
    <div class="notif-bell-wrap" id="notif-bell-wrap">
      <button class="nav-notif-btn" id="notif-btn" onclick="toggleNotifPanel(event)" title="Notifications">
        &#128276;
        <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
      </button>
      <div class="notif-panel" id="notif-panel" style="display:none;">
        <div class="notif-panel-header">
          <span class="notif-panel-title">Notifications</span>
          <button class="notif-clear-btn" onclick="clearAllNotifications()">Clear all</button>
        </div>
        <div class="notif-list" id="notif-list">
          <div class="notif-empty" id="notif-empty">No notifications yet</div>
        </div>
      </div>
    </div>
    <button id="theme-toggle" class="nav-theme-btn" onclick="toggleTheme()">LIGHT</button>
    <a href="/settings" id="gear-btn" class="nav-gear-btn" title="Settings">&#9881;</a>
  </div>
</nav>

<div id="global-notification" class="global-notification" style="display:none;">
  <div class="notification-content">
    <span id="notification-icon" class="notification-icon"></span>
    <div class="notification-text">
      <div id="notification-title"></div>
      <div id="notification-message"></div>
    </div>
    <button class="notification-close" onclick="closeGlobalNotification()">&times;</button>
  </div>
</div>

<main>
{% block content %}{% endblock %}
</main>

<script src="/static/js/functions.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
