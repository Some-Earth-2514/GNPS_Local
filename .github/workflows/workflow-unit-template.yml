name: workflow-unit-template_workflow

on: [push]

jobs:
  test-template_workflow:
    runs-on: ubuntu-latest
    steps:
    - name: Configure Git for symlinks
      run: git config --system core.symlinks false

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python 3.7
      uses: actions/setup-python@v4
      with:
        python-version: 3.7
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with NextFlow
      run: |
        wget -qO- get.nextflow.io | bash
        sudo mv nextflow /usr/local/bin/
        cd template_workflow/test && make test_workflow && cd ../..
